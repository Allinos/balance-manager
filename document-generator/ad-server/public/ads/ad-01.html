<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DocGen Premium</title>
    <!-- Ads are shown in a sandboxed frame WITHOUT JavaScript. Use HTML + CSS only. -->
    <style>
      html, body { margin: 0; height: 100%; font-family: 'Segoe UI', system-ui, sans-serif; }
      body { display: grid; place-items: center; background: linear-gradient(135deg, #eef3ff, #ffffff); color: #1b1e24; }
      .card { text-align: center; padding: 24px; max-width: 360px; }
      .badge { display: inline-block; padding: 4px 10px; border-radius: 20px; background: #1f4fd8; color: #fff; font-size: 12px; font-weight: 600; letter-spacing: .04em; }
      h1 { font-size: 22px; margin: 14px 0 8px; }
      p { color: #4b5260; margin: 0; line-height: 1.5; }
    </style>
  </head>
  <body>
    <div class="card">
      <span class="badge">NEW</span>
      <h1>DocGen Premium</h1>
      <p>Custom templates, priority support and help with setup. Click “Learn More” below.</p>
    </div>
  </body>
</html>
