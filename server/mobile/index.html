<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="description" content="DocGen Mobile — GST invoices, quotations and business documents on your phone. Works offline." />
    <link rel="manifest" href="/app/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/app/icons/icon-192.png" />

      <style>
        .boot { font: 15px/1.5 system-ui, sans-serif; color: #475467; max-width: 460px; margin: 18vh auto; padding: 0 16px; text-align: center; opacity: 0; animation: boot-show 0s 4s forwards; }

      </style>
      <div class="boot">
        <p><strong>DocGen Mobile is taking long to open.</strong></p>
        <p>If this message stays, reload the page or update your browser (Chrome on Android, Safari on iPhone).</p>

    </div>
