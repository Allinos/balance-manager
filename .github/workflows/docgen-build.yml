# Builds the DocGen installers in the cloud — Windows (.exe + .msi) and macOS (.dmg,
# one file for Apple Silicon and Intel Macs) — so no Visual Studio or Xcode is needed
# on your own computer.
#
# Uses NO third-party or marketplace actions (only shell commands and the GitHub CLI),
# because this organization only allows actions owned by Allinos. The GitHub runners
# already have Git, Node.js, Rust and the GitHub CLI installed.
#
# Where to get the installers:
#   GitHub → repository → Releases → "DocGen latest build" →
#   Windows: DocGen_<version>_x64-setup.exe     macOS: DocGen_<version>_universal.dmg
#
# Runs automatically when anything in document-generator/ changes, or manually with
# Actions → "DocGen build" → "Run workflow". Pushing a tag like docgen-v1.1.0 publishes
# a permanent release for that version instead.
#
# How the two builds meet: each build uploads its installers to a temporary draft
# release; when they are done, "publish" replaces the "DocGen latest build" release
# in one go (so it never shows half a build) and the draft is deleted.
#
# macOS signing (optional): without an Apple Developer certificate the app is ad-hoc
# signed — it runs, but the first time macOS asks to confirm opening it (right-click →
# Open, or System Settings → Privacy & Security → Open Anyway). To sign and notarize it,
# add these repository secrets (Settings → Secrets and variables → Actions):
#   APPLE_CERTIFICATE           "Developer ID Application" certificate exported as .p12, base64-encoded
#   APPLE_CERTIFICATE_PASSWORD  password of that .p12
#   APPLE_SIGNING_IDENTITY      e.g. "Developer ID Application: Reynrel (TEAMID1234)"
#   APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID   Apple ID, app-specific password and team id (notarization)

name: DocGen build

on:
  push:
    paths:
      - 'document-generator/**'
      - '.github/workflows/docgen-build.yml'
    tags:
      - 'docgen-v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the installers to the "DocGen latest build" release'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: docgen-build-${{ github.ref }}
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}
  DRAFT: docgen-build-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # An installer whose licensePublicKey does not match the server's key cannot verify any license
      # ("The license returned by the server could not be verified"). Stop before building one.
      - name: Check the license key in remote-config.json matches the server
        run: |
          cfg=$(gh api "repos/$GITHUB_REPOSITORY/contents/document-generator/src-tauri/remote-config.json?ref=$GITHUB_SHA" --jq .content | base64 -d)
          server=$(printf '%s' "$cfg" | jq -r '.serverUrl // ""' | sed 's#/*$##')
          key=$(printf '%s' "$cfg" | jq -r '.licensePublicKey // ""')
          if [ -z "$server" ]; then echo "Offline build (no serverUrl): nothing to check."; exit 0; fi
          if [ -z "$key" ]; then
            echo "::error::remote-config.json has a serverUrl but no licensePublicKey. Open $server/api/app/public-key and copy publicKey into it."
            exit 1
          fi
          live=$(curl -fsS --max-time 20 "$server/api/app/public-key" | jq -r '.publicKey // empty' || true)
          if [ -z "$live" ]; then
            echo "::warning::Could not reach $server/api/app/public-key to compare the license key. Building anyway."
          elif [ "$live" != "$key" ]; then
            echo "::error::licensePublicKey in document-generator/src-tauri/remote-config.json ($key) is not the key of $server ($live). Installers built with it reject every license. Put $live into remote-config.json (or restore the server's previous LICENSE_PRIVATE_KEY) and run the build again."
            exit 1
          else
            echo "License key matches $server."
          fi

      - name: Create a temporary draft release for the installers
        run: |
          gh release create "$DRAFT" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
            --title "DocGen build ${GITHUB_RUN_ID} (in progress)" \
            --notes "Temporary: collects the installers of one build. Deleted automatically when the build finishes."

  windows:
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Get the code
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
          git log -1 --oneline

      - name: Show tool versions
        run: |
          node --version
          npm --version
          rustup default stable-msvc
          rustc --version
          cargo --version

      - name: Install dependencies
        working-directory: document-generator
        run: npm ci

      - name: Unit tests
        working-directory: document-generator
        run: npm test

      - name: Build Windows installers (NSIS .exe + MSI)
        working-directory: document-generator
        run: npx tauri build --bundles nsis,msi

      - name: Upload the installers
        run: |
          mkdir -p out
          cp document-generator/src-tauri/target/release/bundle/nsis/*.exe out/
          cp document-generator/src-tauri/target/release/bundle/msi/*.msi out/
          ls -la out
          gh release upload "$DRAFT" out/* --repo "$GITHUB_REPOSITORY" --clobber

  macos:
    needs: prepare
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Get the code
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
          git log -1 --oneline

      - name: Set up Rust for Apple Silicon and Intel
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          node --version
          rustc --version
          sw_vers

      - name: Install dependencies
        working-directory: document-generator
        run: npm ci

      - name: Unit tests
        working-directory: document-generator
        run: npm test

      - name: Build macOS app + disk image (universal)
        working-directory: document-generator
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Secrets that are not set arrive as empty strings; Tauri must not see those.
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!v}" ] || unset "$v"
          done
          if [ -z "${APPLE_CERTIFICATE:-}" ]; then
            # Ad-hoc signature: required for Apple Silicon; no Apple account needed.
            unset APPLE_SIGNING_IDENTITY
            export APPLE_SIGNING_IDENTITY=-
            echo "No Apple certificate configured: building an ad-hoc signed app (not notarized)."
          fi
          npx tauri build --target universal-apple-darwin --bundles app,dmg

      - name: Check and upload the disk image
        run: |
          bundle=document-generator/src-tauri/target/universal-apple-darwin/release/bundle
          app="$bundle/macos/DocGen.app"
          echo "Architectures: $(lipo -archs "$app/Contents/MacOS/"*)"
          lipo -archs "$app/Contents/MacOS/"* | grep -q arm64
          lipo -archs "$app/Contents/MacOS/"* | grep -q x86_64
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep -E "Identifier|Signature|Authority|TeamIdentifier" || true
          mkdir -p out
          cp "$bundle"/dmg/*.dmg out/
          hdiutil verify out/*.dmg
          ls -la out
          gh release upload "$DRAFT" out/* --repo "$GITHUB_REPOSITORY" --clobber

  publish:
    needs: [windows, macos]
    # Windows is required; if only the Mac build fails, Windows is still published (and the notes say so).
    if: ${{ always() && needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MAC_RESULT: ${{ needs.macos.result }}
      NOTARIZED: ${{ secrets.APPLE_ID != '' && secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - name: Collect the installers
        run: |
          mkdir out
          gh release download "$DRAFT" --repo "$GITHUB_REPOSITORY" --dir out
          ls -la out
          {
            echo "**Windows:** download \`$(cd out && ls *-setup.exe)\` and double-click it."
            echo
            if ls out/*.dmg >/dev/null 2>&1; then
              echo "**macOS** (Apple Silicon and Intel, macOS 10.15 or later): download \`$(cd out && ls *.dmg)\`, open it and drag DocGen into Applications."
              if [ "$NOTARIZED" != "true" ]; then
                echo "The first time, right-click DocGen in Applications → **Open** → **Open** (or System Settings → Privacy & Security → **Open Anyway**). This is needed once, because this build is not notarized by Apple."
              fi
            else
              echo "**macOS:** the Mac build did not finish this time (${MAC_RESULT}); the previous Mac installer is not included."
            fi
          } > notes.md
          cat notes.md

      - name: Publish release for a version tag
        if: startsWith(github.ref, 'refs/tags/docgen-v')
        run: |
          gh release create "$GITHUB_REF_NAME" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "DocGen ${GITHUB_REF_NAME#docgen-v}" \
            --notes-file notes.md

      - name: Publish "latest build" release
        # Skipped for manual runs with "publish" unticked and for pushes whose message contains [wip].
        if: ${{ !startsWith(github.ref, 'refs/tags/') && (github.event_name != 'workflow_dispatch' || inputs.publish) && !contains(github.event.head_commit.message, '[wip]') }}
        run: |
          { echo "Built automatically from ${GITHUB_REF_NAME} (${GITHUB_SHA::7}) on $(date -u '+%Y-%m-%d %H:%M UTC')."; echo; cat notes.md; } > latest.md
          gh release delete docgen-latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create docgen-latest out/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "DocGen latest build" \
            --notes-file latest.md

  cleanup:
    needs: [prepare, publish]
    if: ${{ always() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete the temporary draft release
        run: gh release delete "$DRAFT" --repo "$GITHUB_REPOSITORY" --yes || true
